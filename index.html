<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Grammar Detective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--ink:#2E2433;--muted:#7A6C80;--paper:#FFF9F5;--card:#FFFFFF;--line:#EADDE8;--good:#3E8E5E;--bad:#C2416B;
  --p:#7E4FA6;--p2:#D46A9F;--soft:#F3E8FB;--bubble:#F7EEFB;--display:"Fraunces",Georgia,serif;--body:"Nunito","Segoe UI",Arial,sans-serif}
[data-c="rose"]{--p:#B0306A;--p2:#E96A98;--soft:#FDE6EF;--bubble:#FFF0F5}
[data-c="pearl"]{--p:#3F5F94;--p2:#D27A9E;--soft:#E6EEF9;--bubble:#EEF3FB}
[data-c="sage"]{--p:#4F7A5C;--p2:#D98AA0;--soft:#E6F0E2;--bubble:#EFF6EC}
[data-c="peach"]{--p:#B5586E;--p2:#E08A6C;--soft:#FFE6DD;--bubble:#FFF1EC}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--paper);min-height:100vh;font-size:17px;line-height:1.45}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px 400px at 100% 0%,color-mix(in srgb,var(--p2) 18%,transparent),transparent 70%),radial-gradient(500px 400px at 0% 100%,color-mix(in srgb,var(--p) 14%,transparent),transparent 70%)}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:0 16px 40px}
.deco{position:fixed;width:150px;pointer-events:none;opacity:.95;z-index:0}.deco.l{left:-34px;bottom:-26px}.deco.r{right:-34px;top:-30px;transform:rotate(180deg)}
header{position:relative;z-index:1;padding:22px 0 8px;text-align:center}
.kick{font-size:11px;letter-spacing:.22em;font-weight:800;color:var(--p2);text-transform:uppercase}
h1{font-family:var(--display);font-size:32px;margin:4px 0 2px;color:var(--p);letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px;margin:0}
main{position:relative;z-index:1}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 24px -14px rgba(60,20,70,.35);margin:14px 0}
label{font-weight:800;font-size:14px;color:var(--p)}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;margin:6px 0 2px}
input[type=text]:focus{outline:3px solid color-mix(in srgb,var(--p) 30%,transparent);border-color:var(--p)}
.swatches{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.missions{display:grid;gap:12px}
.mission{display:flex;gap:14px;align-items:center;text-align:left;width:100%;font:inherit;color:inherit;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:14px;cursor:pointer;transition:transform .15s}
.mission:hover,.mission:focus-visible{transform:translateY(-2px);border-color:var(--p);outline:none}
.mission .ic{flex:0 0 54px;height:54px;border-radius:16px;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.mission .ic img{width:46px;height:46px;object-fit:contain}
.mission b{display:block;font-family:var(--display);font-size:18px;color:var(--p)}
.mission small{color:var(--muted);font-size:13.5px}
.mission .badge{margin-left:auto;font-size:13px;font-weight:800;color:var(--good);white-space:nowrap}
.today{border-color:var(--p2);box-shadow:0 0 0 3px color-mix(in srgb,var(--p2) 25%,transparent)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;color:#fff;background:var(--p2);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
/* chat */
.top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);padding:10px 0;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.back{font:inherit;font-weight:800;border:0;background:var(--soft);color:var(--p);border-radius:12px;padding:8px 12px;cursor:pointer}
.grp{flex:1;min-width:0}.grp b{display:block;font-size:15px}.grp small{color:var(--muted);font-size:12.5px}
.prog{display:flex;gap:4px;margin-top:4px}.prog i{flex:1;height:5px;border-radius:9px;background:var(--line)}.prog i.ok{background:var(--good)}.prog i.ko{background:var(--p2)}.prog i.now{background:var(--p)}
.chat{display:flex;flex-direction:column;gap:8px;padding:14px 0 8px}
.msg{max-width:86%;padding:10px 13px;border-radius:18px 18px 18px 6px;background:#fff;border:1px solid var(--line);animation:pop .3s ease-out;font-size:16px}
.msg .who{display:block;font-size:12px;font-weight:800;margin-bottom:2px}
.msg.me{align-self:flex-end;background:var(--p);color:#fff;border-color:var(--p);border-radius:18px 18px 6px 18px}
.msg.me .who{color:#fff;opacity:.85}
.msg.sys{align-self:center;background:var(--soft);border:0;font-size:13px;color:var(--p);font-weight:700;border-radius:999px;padding:5px 12px}
.msg .wrong{background:color-mix(in srgb,var(--bad) 14%,#fff);border-bottom:2px dashed var(--bad);padding:0 3px;border-radius:4px}
.typing{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.task{background:#fff;border:2px solid var(--p);border-radius:22px;padding:16px;margin-top:6px;animation:pop .3s ease-out}
.task h2{font-family:var(--display);font-size:19px;margin:0 0 4px;color:var(--p)}
.task p.q{margin:0 0 12px;font-weight:700}
.opts{display:grid;gap:9px}
.opt{font:inherit;text-align:left;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bubble);cursor:pointer;color:var(--ink)}
.opt:hover,.opt:focus-visible{border-color:var(--p);outline:none}
.opt.ok{background:color-mix(in srgb,var(--good) 16%,#fff);border-color:var(--good);font-weight:800}
.opt.ko{background:color-mix(in srgb,var(--bad) 12%,#fff);border-color:var(--bad);text-decoration:line-through;opacity:.75}
.tiles,.built{display:flex;flex-wrap:wrap;gap:8px}
.built{min-height:52px;border:2px dashed var(--line);border-radius:14px;padding:8px;margin-bottom:10px;background:var(--bubble)}
.tile{font:inherit;font-weight:700;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.tile:disabled{opacity:.25;cursor:default}
.built .tile{background:var(--p);color:#fff;border-color:var(--p)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:11px 16px;cursor:pointer;background:var(--p);color:#fff}
.btn.ghost{background:var(--soft);color:var(--p)}
.btn:disabled{opacity:.4;cursor:default}
.fb{margin-top:12px;border-radius:14px;padding:11px 13px;font-size:15px;animation:pop .25s ease-out}
.fb.ok{background:color-mix(in srgb,var(--good) 12%,#fff);border:1.5px solid var(--good)}
.fb.ko{background:color-mix(in srgb,var(--bad) 9%,#fff);border:1.5px solid var(--bad)}
.fb.clue{background:#FFF8E6;border:1.5px dashed #D9A93B}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.nohint{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--p2);text-transform:uppercase}
.end{text-align:center}
.medal{width:150px;height:150px;margin:6px auto 8px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,var(--soft) 55%,var(--p2));box-shadow:0 0 0 6px #fff,0 0 0 8px var(--p),0 14px 30px -12px var(--p);font-size:62px;animation:pop .5s}
.stars{font-size:30px;color:#E0A526;letter-spacing:4px}.stars .off{color:var(--line)}
.key li{margin:6px 0}.key b{color:var(--good)}
footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:26px;position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

// ---------- state ----------
const store = { get(k, d) { try { const v = localStorage.getItem('gd_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem('gd_' + k, JSON.stringify(v)); } catch (e) {} } };
let me = store.get('me', { name: '', c: 'lilac' });
document.body.dataset.c = me.c;
const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mark = s => esc(s).replace(/\[\[(.+?)\]\]/g, '<span class="wrong">$1</span>');
const wait = ms => new Promise(r => setTimeout(r, ms));

function home(focus) {
  const done = store.get('done', {});
  const COLORS = [['lilac', '#7E4FA6'], ['rose', '#B0306A'], ['pearl', '#3F5F94'], ['sage', '#4F7A5C'], ['peach', '#B5586E']];
  app.innerHTML = `
  <section class="card"><label for="nick">Your detective name</label>
    <input id="nick" type="text" maxlength="18" placeholder="e.g. Agent Jasmine" value="${esc(me.name)}" autocomplete="off">
    <div class="hint">Use a nickname, not your real name.</div>
    <div style="margin-top:12px"><label>Chat colour</label><div class="swatches">${COLORS.map(([k, c]) => `<button class="sw" style="background:${c}" aria-label="${k}" aria-pressed="${me.c === k}" data-c="${k}"></button>`).join('')}</div></div>
  </section>
  <section class="missions">${MISSIONS.map(m => `<button class="mission ${focus === m.id ? 'today' : ''}" data-m="${m.id}">
    <span class="ic"><img src="${IMG['m' + m.id]}" alt=""></span>
    <span><small>Mission ${m.id} · ${m.day}${focus === m.id ? '<span class="tag">TODAY</span>' : ''}</small><b>${m.title}</b><small>${m.focus}</small></span>
    ${done[m.id] != null ? `<span class="badge">★ ${done[m.id]}/8</span>` : ''}</button>`).join('')}</section>`;
  const nick = app.querySelector('#nick');
  nick.addEventListener('input', () => { me.name = nick.value.trim(); store.set('me', me); });
  app.querySelectorAll('.sw').forEach(b => b.onclick = () => { me.c = b.dataset.c; document.body.dataset.c = me.c; store.set('me', me); app.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  app.querySelectorAll('.mission').forEach(b => b.onclick = () => { if (!me.name) { nick.focus(); nick.classList.add('shake'); setTimeout(() => nick.classList.remove('shake'), 400); return; } play(+b.dataset.m); });
  if (focus) app.querySelector('.today')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

async function play(id) {
  const M = MISSIONS.find(m => m.id === id); let score = 0;
  history.replaceState(null, '', '?m=' + id);
  app.innerHTML = `<div class="top"><button class="back" aria-label="Back to missions">‹</button><div class="grp"><b>${M.group} 💬</b><small>Mission ${M.id} · ${M.title}</small>
    <div class="prog">${M.items.map(() => '<i></i>').join('')}</div></div></div><div class="chat" aria-live="polite"></div><div id="task"></div>`;
  app.querySelector('.back').onclick = () => { history.replaceState(null, '', location.pathname); home(id); };
  const chat = app.querySelector('.chat'), bars = app.querySelectorAll('.prog i'), taskBox = app.querySelector('#task');
  const say = async (who, text, extra = '') => {
    const t = document.createElement('div'); t.className = 'typing'; t.innerHTML = '<i></i><i></i><i></i>'; chat.append(t); t.scrollIntoView({ block: 'end', behavior: 'smooth' });
    await wait(650); t.remove();
    const d = document.createElement('div'); d.className = 'msg ' + extra;
    d.innerHTML = (who ? `<span class="who" style="color:${extra === 'me' ? '#fff' : FRIENDS[who] || 'var(--p)'}">${esc(who)}</span>` : '') + text;
    chat.append(d); d.scrollIntoView({ block: 'end', behavior: 'smooth' });
  };
  const sys = t => { const d = document.createElement('div'); d.className = 'msg sys'; d.textContent = t; chat.append(d); };
  sys(`${me.name || 'Detective'} joined the chat`);
  for (const [w, t] of M.intro) await say(w, esc(t));
  for (let i = 0; i < M.items.length; i++) {
    const it = M.items[i]; bars[i].classList.add('now');
    await say(it.who, mark(it.msg));
    const first = await ask(it, taskBox, i);
    bars[i].classList.remove('now'); bars[i].classList.add(first ? 'ok' : 'ko'); if (first) score++;
    await say(me.name || 'Detective', it.type === 'build' ? esc(it.answer) : it.full ? esc(it.opts[it.a]) : (/\[\[|___/.test(it.msg) ? esc(it.msg).replace(/\[\[.+?\]\]|___/, `<b>${esc(it.opts[it.a])}</b>`) : '✓ ' + esc(it.opts[it.a])), 'me');
  }
  const done = store.get('done', {}); done[id] = Math.max(done[id] || 0, score); store.set('done', done);
  const stars = score >= 7 ? 3 : score >= 5 ? 2 : 1;
  taskBox.innerHTML = `<section class="card end"><div class="medal" aria-hidden="true">🕵️‍♀️</div>
    <h2 style="font-family:var(--display);color:var(--p);margin:6px 0 2px">Case closed, ${esc(me.name || 'Detective')}!</h2>
    <div class="stars" aria-label="${stars} stars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3 - stars)}</span></div>
    <p><b>${score} / 8</b> correct the first time · Mission ${id}: ${M.title}</p>
    <p class="hint">Show this badge to Mr. Abdelkader. Then explain ONE correction to the class.</p>
    <div class="row" style="justify-content:center"><button class="btn" id="again">Play again</button><button class="btn ghost" id="menu">All missions</button></div></section>`;
  taskBox.scrollIntoView({ behavior: 'smooth' });
  taskBox.querySelector('#again').onclick = () => play(id);
  taskBox.querySelector('#menu').onclick = () => { history.replaceState(null, '', location.pathname); home(id); };
}

function ask(it, box, i) {
  return new Promise(res => {
    let tries = 0;
    const head = `<section class="task"><h2>Challenge ${i + 1} of 8</h2>${it.noClue ? '<div class="nohint">No clues: show what you know</div>' : ''}<p class="q">${esc(it.q)}</p>`;
    const tail = `<div class="row">${it.noClue ? '' : '<button class="btn ghost" id="clue">Give me a clue</button>'}</div><div id="fb"></div></section>`;
    const fb = (cls, html) => { box.querySelector('#fb').innerHTML = `<div class="fb ${cls}">${html}</div>`; };
    const finish = () => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = i === 7 ? 'See my badge' : 'Next message'; b.onclick = () => { box.innerHTML = ''; res(tries === 0); }; box.querySelector('#fb').append(b); b.focus(); };
    if (it.type === 'choice') {
      box.innerHTML = head + `<div class="opts">${it.opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div>` + tail;
      box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const k = +b.dataset.k;
        if (k === it.a) { b.classList.add('ok'); box.querySelectorAll('.opt').forEach(x => x.disabled = true); fb('ok', `<b>${tries ? 'Now you\'ve got it!' : 'Excellent detective work!'}</b> ${esc(it.why)}`); finish(); }
        else { tries++; b.classList.add('ko'); b.disabled = true; box.querySelector('.task').classList.add('shake'); setTimeout(() => box.querySelector('.task')?.classList.remove('shake'), 400);
               fb('ko', `<b>Not quite.</b> ${esc(it.clue || 'Read the message again and try another answer.')}`); }
      });
    } else {
      const order = it.tiles.map((t, k) => k).sort(() => Math.random() - .5);
      box.innerHTML = head + `<div class="built" aria-label="Your sentence"></div><div class="tiles">${order.map(k => `<button class="tile" data-k="${k}">${esc(it.tiles[k])}</button>`).join('')}</div>
        <div class="row"><button class="btn" id="check" disabled>Check</button><button class="btn ghost" id="reset">Clear</button>${it.noClue ? '' : '<button class="btn ghost" id="clue">Give me a clue</button>'}</div><div id="fb"></div></section>`;
      const built = box.querySelector('.built'); const pick = [];
      const sync = () => { box.querySelector('#check').disabled = pick.length !== it.tiles.length; };
      box.querySelectorAll('.tiles .tile').forEach(t => t.onclick = () => {
        t.disabled = true; pick.push(+t.dataset.k);
        const c = document.createElement('button'); c.className = 'tile'; c.textContent = t.textContent;
        c.onclick = () => { if (box.querySelector('#check').dataset.done) return; const k = +t.dataset.k; pick.splice(pick.indexOf(k), 1); c.remove(); t.disabled = false; sync(); };
        built.append(c); sync();
      });
      box.querySelector('#reset').onclick = () => { if (box.querySelector('#check').dataset.done) return; pick.length = 0; built.innerHTML = ''; box.querySelectorAll('.tiles .tile').forEach(t => t.disabled = false); sync(); };
      box.querySelector('#check').onclick = () => {
        const s = pick.map(k => it.tiles[k]).join(' ').replace(/\s+([,.?!])/g, '$1');
        const ok = [it.answer, ...(it.alt || [])].some(a => a.replace(/\s+/g, ' ') === s);
        if (ok) { box.querySelector('#check').dataset.done = 1; box.querySelector('#check').disabled = true; built.style.borderColor = 'var(--good)'; fb('ok', `<b>${tries ? 'Now you\'ve got it!' : 'Perfect order!'}</b> ${esc(it.why)}`); finish(); }
        else { tries++; box.querySelector('.task').classList.add('shake'); setTimeout(() => box.querySelector('.task')?.classList.remove('shake'), 400); fb('ko', `<b>Not quite.</b> ${esc(it.clue || 'Think about the word order: who + how often + verb + the rest.')}`); }
      };
    }
    const cl = box.querySelector('#clue'); if (cl) cl.onclick = () => { fb('clue', '💡 ' + esc(it.clue)); };
  });
}

function key() {
  app.innerHTML = MISSIONS.map(m => `<section class="card key"><h2 style="font-family:var(--display);color:var(--p);margin:0">Mission ${m.id} · ${m.title}</h2><small>${m.day} · ${m.focus}</small><ol>${m.items.map(it =>
    `<li>${esc(it.msg.replace(/\[\[(.+?)\]\]/g, '$1'))} → <b>${esc(it.type === 'build' ? it.answer : it.opts[it.a])}</b><br><small>${esc(it.why)}</small></li>`).join('')}</ol></section>`).join('');
}

if (params.has('key')) key();
else { const m = +params.get('m'); if (m && me.name) play(m); else home(m || 0); }
</script>
