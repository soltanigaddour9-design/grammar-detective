<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exit ticket · group chat</title>
<meta name="theme-color" content="#12062A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root { --a: #FF2E9A; --b: #7B2CBF; --c: #22D3EE; --bg: #12062A; --me: #FFE3F3; --ink: #1D1030; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font-family: 'Nunito', system-ui, sans-serif; color: var(--ink); background: var(--bg); overflow: hidden; }
.app { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; background: var(--bg); box-shadow: 0 0 60px rgba(0,0,0,.5); }
.wall { position: absolute; inset: 0; z-index: 0; overflow: hidden;
  background: radial-gradient(500px 300px at 10% 0%, color-mix(in srgb, var(--a) 45%, transparent), transparent 70%), radial-gradient(520px 340px at 100% 30%, color-mix(in srgb, var(--b) 60%, transparent), transparent 70%),
              radial-gradient(600px 300px at 50% 110%, color-mix(in srgb, var(--c) 35%, transparent), transparent 70%), var(--bg); }
.wall::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(color-mix(in srgb, var(--c) 14%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--c) 14%, transparent) 1px, transparent 1px); background-size: 34px 34px; mask-image: linear-gradient(transparent, #000 60%); -webkit-mask-image: linear-gradient(transparent, #000 60%); }
.wall i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: .6; animation: tw 3s ease-in-out infinite; }
@keyframes tw { 50% { opacity: .15; } }
header { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; background: color-mix(in srgb, var(--bg) 70%, #000); border-bottom: 1px solid color-mix(in srgb, var(--c) 40%, transparent); color: #fff; }
.gav { width: 44px; height: 44px; flex: none; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); background: linear-gradient(135deg, var(--a), var(--b)); display: grid; place-items: center; font-size: 22px; box-shadow: 0 0 18px var(--a); }
.gname { font-weight: 900; font-size: 16.5px; line-height: 1.1; } .gsub { font-size: 12px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hd { flex: 1; min-width: 0; } .pill { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 800; padding: 6px 10px; border-radius: 99px; background: rgba(255,255,255,.12); border: 1px solid var(--c); color: #fff; white-space: nowrap; }
main { position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 14px 10px 8px; scroll-behavior: smooth; }
.sys { text-align: center; margin: 8px auto 12px; } .sys span { display: inline-block; font-size: 12px; font-weight: 800; color: #fff; background: rgba(255,255,255,.14); padding: 5px 12px; border-radius: 10px; backdrop-filter: blur(6px); }
.row { display: flex; margin: 3px 0; animation: pop .28s cubic-bezier(.34,1.56,.64,1); } .row.me { justify-content: flex-end; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.96); } }
.av { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 15px; font-weight: 900; color: #fff; margin: auto 6px 2px 0; box-shadow: 0 0 10px rgba(0,0,0,.3); }
.bub { position: relative; min-width: 118px; max-width: 80%; padding: 7px 10px 18px; border-radius: 14px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.18); font-size: 16px; line-height: 1.35; font-weight: 700; }
.row:not(.me) .bub { border-top-left-radius: 4px; } .row.me .bub { background: var(--me); border-top-right-radius: 4px; }
.who { display: block; font-size: 12.5px; font-weight: 900; margin-bottom: 2px; }
.tm { position: absolute; right: 8px; bottom: 3px; font-size: 10.5px; color: #8A7A99; font-weight: 700; } .tk { color: var(--a); margin-left: 2px; }
.bub.ok { box-shadow: 0 0 0 2px #1E9E6A, 0 2px 8px rgba(0,0,0,.18); } .bub.no { box-shadow: 0 0 0 2px #E5484D, 0 2px 8px rgba(0,0,0,.18); }
.why { display: block; margin-top: 4px; font-weight: 700; color: #4B3A5C; font-size: 14.5px; }
.typing .bub { padding: 10px 14px; } .dots i { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: #B9A6CC; animation: dt 1s infinite; } .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dt { 50% { transform: translateY(-4px); background: var(--a); } }
footer { position: relative; z-index: 2; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 75%, #000); border-top: 1px solid color-mix(in srgb, var(--a) 40%, transparent); }
.hint { color: #fff; opacity: .85; font-size: 12.5px; font-weight: 800; margin: 0 4px 6px; }
.chips { display: flex; flex-direction: column; gap: 7px; }
.chip { text-align: left; border: 0; border-radius: 16px; padding: 11px 14px; font: inherit; font-size: 15.5px; font-weight: 800; color: var(--ink); background: #fff; box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 70%, transparent), 0 4px 14px rgba(0,0,0,.25); cursor: pointer; transition: transform .15s; }
.chip:active { transform: scale(.97); } .chip.x { opacity: .45; text-decoration: line-through; box-shadow: 0 0 0 2px #E5484D; pointer-events: none; }
.join { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 22px; }
.card { width: 100%; max-width: 400px; background: rgba(255,255,255,.95); border-radius: 26px; padding: 22px; text-align: center; box-shadow: 0 0 0 2px var(--a), 0 0 40px color-mix(in srgb, var(--a) 60%, transparent); animation: pop .4s; }
.card h1 { font-family: 'Orbitron', sans-serif; font-size: 22px; margin: 8px 0 4px; background: linear-gradient(90deg, var(--a), var(--b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.card p { margin: 6px 0 14px; color: #5B4A6E; font-weight: 700; }
.card input { width: 100%; padding: 13px 14px; border-radius: 14px; border: 2px solid #E6DDF2; font: inherit; font-size: 17px; font-weight: 800; text-align: center; }
.card input:focus { outline: none; border-color: var(--a); }
.btn { margin-top: 12px; width: 100%; border: 0; border-radius: 99px; padding: 14px; font: inherit; font-weight: 900; font-size: 17px; color: #fff; background: linear-gradient(90deg, var(--a), var(--b)); box-shadow: 0 6px 18px color-mix(in srgb, var(--a) 50%, transparent); cursor: pointer; }
.big { font-size: 48px; } .score { font-family: 'Orbitron', sans-serif; font-size: 34px; font-weight: 800; color: var(--b); margin: 4px 0; }
.res { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 10px 0; } .res span { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font-weight: 900; color: #fff; }
.g1 { background: #1E9E6A; } .g2 { background: #E8A100; } .g3 { background: #E5484D; }
.conf { position: fixed; inset: 0; pointer-events: none; z-index: 9; overflow: hidden; } .conf i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 3px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
/* teacher board */
.boardwrap { position: fixed; inset: 0; overflow: auto; background: #faf7ff; padding: 18px; color: var(--ink); z-index: 10; }
.boardwrap h2 { margin: 0 0 4px; } table { border-collapse: collapse; margin-top: 12px; } td, th { border: 1px solid #e3d9f0; padding: 8px 10px; text-align: center; font-weight: 800; } th { background: var(--b); color: #fff; }
.list a { color: #fff; } .list { color: #fff; padding: 20px; }
</style>
</head>
<body>
<div class="app" id="app"><div class="wall" id="wall"></div>
<header><div class="gav" id="gav">💜</div><div class="hd"><div class="gname" id="gname">Group chat</div><div class="gsub" id="gsub">tap to join</div></div><span class="pill" id="prog">0/8</span></header>
<main id="chat"></main>
<footer><div class="hint" id="hint">Type your name to join the group.</div><div class="chips" id="chips"></div></footer>
</div>
<script src="tickets.js"></script>
<script>
const P = new URLSearchParams(location.search), id = P.get('t'), TK = TICKETS[id];
const TOPIC = 'https://ntfy.sh/gd-chat-h7q3x9m2kp' + (P.get('room') ? '-' + P.get('room').replace(/[^a-z0-9]/gi, '').slice(0, 12) : '');
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));
const COLS = ['#E0218A', '#7B2CBF', '#0E9C93', '#D9732B'], AV = ['🌸', '🦋', '✨', '🌙'];
for (let k = 0; k < 40; k++) { const i = document.createElement('i'); i.style.left = Math.random() * 100 + '%'; i.style.top = Math.random() * 100 + '%'; i.style.animationDelay = Math.random() * 3 + 's'; $('#wall').appendChild(i); }
let actx; const beep = (f = 880, d = .08) => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.type = 'sine'; g.gain.setValueAtTime(.08, actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d); o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + d); } catch (e) {} };
const now = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function theme(t) { const r = document.documentElement.style; r.setProperty('--a', t.a); r.setProperty('--b', t.b); r.setProperty('--c', t.c); r.setProperty('--bg', t.bg); document.querySelector('meta[name=theme-color]').content = t.bg; }
function list() {
  $('#app').innerHTML = '<div class="list"><h2>Exit tickets · group chats</h2>' + Object.keys(TICKETS).map(k => `<p><a href="?t=${k}"><b>${esc(TICKETS[k].cls)} · Day ${TICKETS[k].day} · ${esc(TICKETS[k].title)}</b></a><br><small>${esc(TICKETS[k].date)} · <a href="?board&t=${k}">teacher board</a></small></p>`).join('') + '</div>';
}
function add(html, me, cls = '') { const d = document.createElement('div'); d.className = 'row ' + (me ? 'me ' : '') + cls; d.innerHTML = html; $('#chat').appendChild(d); $('#chat').scrollTop = 1e9; return d; }
function sys(t) { const d = document.createElement('div'); d.className = 'sys'; d.innerHTML = `<span>${t}</span>`; $('#chat').appendChild(d); }
function friend(who, text, cls = '') {
  const k = Math.max(0, TK.members.indexOf(who)); beep(660, .06);
  return add(`<div class="av" style="background:${COLS[k % 4]}">${AV[k % 4]}</div><div class="bub ${cls}"><span class="who" style="color:${COLS[k % 4]}">${esc(who)}</span>${text}<span class="tm">${now()}</span></div>`);
}
async function typing(who, ms = 900) { const k = Math.max(0, TK.members.indexOf(who)); const d = add(`<div class="av" style="background:${COLS[k % 4]}">${AV[k % 4]}</div><div class="bub"><span class="dots"><i></i><i></i><i></i></span></div>`, false, 'typing'); $('#gsub').textContent = who + ' is typing…'; await wait(ms); d.remove(); $('#gsub').textContent = TK.members.join(', ') + ', You'; }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const NO = ['Hmm 🤔 not that one… choose another one!', 'Nooo 😅 try another reply!', 'Almost! 🙈 choose another one.', 'Not quite 💭 pick another one!'];
const YES = ['Yesss 💖', 'Exactly!! 🎉', 'Perfect 😍', 'Correct ✨', 'You\'re a genius 💜'];
function student() {
  theme(TK.theme || {}); document.title = TK.group + ' · ' + TK.title;
  $('#gname').textContent = TK.group; $('#gsub').textContent = TK.members.join(', ') + ' · ' + TK.title; $('#prog').textContent = '0/' + TK.qs.length;
  const j = document.createElement('div'); j.className = 'join';
  j.innerHTML = `<div class="card"><div class="big">💬</div><h1>${esc(TK.group)}</h1><p>${esc(TK.cls)} · Day ${TK.day} · ${esc(TK.title)}<br>${esc(TK.date)}</p><input id="nm" maxlength="20" placeholder="Your first name" autocomplete="given-name"><button class="btn" id="go">Join the chat 💜</button></div>`;
  $('#app').appendChild(j); $('#nm').focus();
  $('#go').onclick = () => { const n = $('#nm').value.trim(); if (!n) { $('#nm').focus(); return; } j.remove(); run(n); };
  $('#nm').onkeydown = e => { if (e.key === 'Enter') $('#go').click(); };
}
async function run(name) {
  const sid = Math.random().toString(36).slice(2, 9); const tries = [];
  const send = o => { try { fetch(TOPIC, { method: 'POST', body: JSON.stringify({ v: 1, t: id, s: sid, n: name, ...o }), keepalive: true }).catch(() => {}); } catch (e) {} };
  send({ e: 'join' });
  sys(`${esc(TK.members[0])} added you`); sys(`Today · ${esc(TK.date)}`);
  await typing(TK.members[0], 700); friend(TK.members[0], esc(TK.intro.replace('{name}', name)));
  $('#hint').textContent = 'Tap the right reply. Wrong? Choose another one!';
  for (let i = 0; i < TK.qs.length; i++) {
    const q = TK.qs[i]; await typing(q.who, 800 + Math.min(900, q.q.length * 12)); friend(q.who, esc(q.q));
    let n = 0; const opts = shuffle(q.o.map((t, k) => ({ t, k })));
    while (true) {
      const pick = await new Promise(res => { $('#chips').innerHTML = ''; opts.forEach(o => { const b = document.createElement('button'); b.className = 'chip' + (o.x ? ' x' : ''); b.textContent = o.t; b.onclick = () => res(o); $('#chips').appendChild(b); }); $('#chat').scrollTop = 1e9; });
      n++; $('#chips').innerHTML = ''; beep(990, .05);
      add(`<div class="bub ${pick.k === q.a ? 'ok' : 'no'}">${esc(pick.t)}<span class="tm">${now()}<span class="tk">✓✓</span></span></div>`, true);
      send({ e: 'a', q: i, k: pick.k, ok: pick.k === q.a, n });
      if (pick.k === q.a) { await typing(q.who, 600); friend(q.who, `<b>${YES[Math.floor(Math.random() * YES.length)]}</b><span class="why">${esc(q.w)}</span>`, 'ok'); beep(1320, .12); break; }
      pick.x = true; await typing(q.who, 550); friend(q.who, NO[(n - 1) % NO.length], 'no'); beep(220, .15);
    }
    tries.push(n); $('#prog').textContent = (i + 1) + '/' + TK.qs.length;
  }
  $('#hint').textContent = 'Chat complete! Show this screen to your teacher.';
  const first = tries.filter(x => x === 1).length; send({ e: 'done', score: first, tries });
  await typing(TK.members[TK.members.length - 1], 700); friend(TK.members[TK.members.length - 1], esc(TK.outro.replace('{name}', name)));
  const c = document.createElement('div'); c.className = 'row'; c.style.justifyContent = 'center';
  c.innerHTML = `<div class="card" style="margin:10px 0"><div class="big">${first >= 7 ? '🏆' : first >= 5 ? '🌟' : '💪'}</div><div class="score">${first} / ${TK.qs.length}</div><p>right on the first try, ${esc(name)}</p><div class="res">${tries.map((x, k) => `<span class="${x === 1 ? 'g1' : x === 2 ? 'g2' : 'g3'}" title="Q${k + 1}: ${x} tries">${k + 1}</span>`).join('')}</div><p style="font-size:13px">green = first try · amber = second · red = more</p></div>`;
  $('#chat').appendChild(c); $('#chat').scrollTop = 1e9;
  if (first >= 5) { const f = document.createElement('div'); f.className = 'conf'; for (let k = 0; k < 90; k++) { const i = document.createElement('i'); i.style.left = Math.random() * 100 + '%'; i.style.background = [TK.theme.a, TK.theme.b, TK.theme.c, '#FFC857'][k % 4]; i.style.animationDuration = 2 + Math.random() * 2 + 's'; i.style.animationDelay = Math.random() * .6 + 's'; f.appendChild(i); } document.body.appendChild(f); setTimeout(() => f.remove(), 4500); }
}
function board() {
  theme(TK.theme || {}); const rows = {}; const cut = Date.now() - 1000 * 60 * 60 * 3;
  const w = document.createElement('div'); w.className = 'boardwrap'; document.body.appendChild(w);
  const draw = () => {
    const st = Object.values(rows);
    w.innerHTML = `<h2>Teacher board · ${esc(TK.title)} · Day ${TK.day}</h2><div>${esc(TK.date)} · student link: ${esc(location.origin + location.pathname)}?t=${esc(id)} · live (last 3 hours)</div>
    <table><tr><th>Student</th>${TK.qs.map((q, i) => `<th title="${esc(q.q)}">Q${i + 1}</th>`).join('')}<th>First try</th></tr>
    ${st.map(r => `<tr><td>${esc(r.n)}</td>${TK.qs.map((q, i) => { const x = r.q[i]; return `<td class="${x ? (x.done ? (x.n === 1 ? 'g1' : x.n === 2 ? 'g2' : 'g3') : '') : ''}" style="color:${x && x.done ? '#fff' : '#999'}">${x ? (x.done ? x.n : '…') : ''}</td>`; }).join('')}<td>${r.score ?? ''}</td></tr>`).join('')}</table>
    <h3>Answer key</h3><ol>${TK.qs.map(q => `<li><b>${esc(q.q)}</b> → ${esc(q.o[q.a])}</li>`).join('')}</ol>`;
  };
  draw();
  const es = new EventSource(`${TOPIC}/sse?since=3h`);
  es.onmessage = ev => { try { const m = JSON.parse(JSON.parse(ev.data).message); if (m.t !== id) return; const r = rows[m.s] = rows[m.s] || { n: m.n, q: {} }; r.n = m.n;
    if (m.e === 'a') { const x = r.q[m.q] = r.q[m.q] || { n: 0 }; x.n = m.n; if (m.ok) x.done = true; } if (m.e === 'done') r.score = m.score; draw(); } catch (e) {} };
}
if (!TK) list(); else if (P.has('board')) board(); else student();
</script>
</body>
</html>
